name: Verify opening screen

on:
  push:
    branches: [main]
    paths:
      - "components/opening/**"
      - "app/globals.css"
      - "public/opening/**"
      - ".github/workflows/verify-opening.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/invitation-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/invitation-next.log
          exit 1

      - name: Verify responsive opening and capture screenshots
        run: |
          mkdir -p screenshots
          cat > capture.cjs <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'mobile-320', width: 320, height: 568, capture: false },
              { name: 'mobile', width: 390, height: 844, capture: true },
              { name: 'mobile-430', width: 430, height: 932, capture: false },
              { name: 'tablet', width: 768, height: 1024, capture: false },
              { name: 'desktop', width: 1440, height: 900, capture: true },
            ];

            for (const item of cases) {
              const page = await browser.newPage({
                viewport: { width: item.width, height: item.height },
                deviceScaleFactor: 1,
              });

              await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' });
              await page.waitForTimeout(1600);

              const closed = await page.evaluate(() => {
                const scene = document.querySelector('.opening-scene');
                if (scene) scene.scrollTop = 0;
                const box = document.querySelector('.box-stage')?.getBoundingClientRect();
                const button = document.querySelector('.open-invitation')?.getBoundingClientRect();
                return {
                  scrollWidth: document.documentElement.scrollWidth,
                  innerWidth: window.innerWidth,
                  box: box && { left: box.left, right: box.right, top: box.top, bottom: box.bottom },
                  button: button && { left: button.left, right: button.right, top: button.top, bottom: button.bottom },
                  sceneScrollHeight: scene?.scrollHeight ?? 0,
                  sceneClientHeight: scene?.clientHeight ?? 0,
                };
              });

              console.log(item.name, 'closed', closed);

              if (closed.scrollWidth > closed.innerWidth + 2) {
                throw new Error(`${item.name}: horizontal overflow`);
              }
              if (!closed.box || closed.box.left < -2 || closed.box.right > item.width + 2) {
                throw new Error(`${item.name}: box clipped horizontally: ${JSON.stringify(closed.box)}`);
              }
              if (!closed.button || closed.button.left < -2 || closed.button.right > item.width + 2) {
                throw new Error(`${item.name}: button clipped horizontally: ${JSON.stringify(closed.button)}`);
              }

              if (item.capture) {
                await page.screenshot({
                  path: `screenshots/${item.name}-closed.png`,
                  fullPage: false,
                });
              }

              await page.click('.open-invitation');
              await page.waitForTimeout(2500);
              await page.evaluate(() => {
                const scene = document.querySelector('.opening-scene');
                if (scene) scene.scrollTop = 0;
              });

              const opened = await page.evaluate(() => {
                const card = document.querySelector('.box-card-slot')?.getBoundingClientRect();
                const tray = document.querySelector('.box-inner-tray')?.getBoundingClientRect();
                const button = document.querySelector('.open-invitation')?.getBoundingClientRect();
                return {
                  card: card && { left: card.left, right: card.right, top: card.top, bottom: card.bottom },
                  tray: tray && { left: tray.left, right: tray.right, top: tray.top, bottom: tray.bottom },
                  button: button && { left: button.left, right: button.right, top: button.top, bottom: button.bottom },
                };
              });

              console.log(item.name, 'open', opened);

              if (!opened.card || !opened.tray || !opened.button) {
                throw new Error(`${item.name}: missing open-state geometry`);
              }
              if (
                opened.card.left < opened.tray.left - 8 ||
                opened.card.right > opened.tray.right + 8 ||
                opened.card.top < opened.tray.top - 8 ||
                opened.card.bottom > opened.tray.bottom + 8
              ) {
                throw new Error(`${item.name}: card escapes tray: ${JSON.stringify(opened)}`);
              }
              if (opened.card.bottom > opened.button.top - 4) {
                throw new Error(`${item.name}: card overlaps button: ${JSON.stringify(opened)}`);
              }

              if (item.capture) {
                await page.screenshot({
                  path: `screenshots/${item.name}-open.png`,
                  fullPage: false,
                });
              }

              await page.click('.open-invitation');
              await page.waitForTimeout(1500);
              const exited = await page.evaluate(() => {
                const scene = document.querySelector('.opening-scene');
                return !scene || getComputedStyle(scene).display === 'none' || scene.getBoundingClientRect().width === 0;
              });
              if (!exited) {
                throw new Error(`${item.name}: second click did not enter invitation`);
              }

              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node capture.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-screen-screenshots
          path: screenshots/
          if-no-files-found: error
